name: Tests
on:
  push:
    branches: [staging, production]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php: '8.2'
            testbench: '^10.0'
          - php: '8.3'
            testbench: '^11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --with-all-dependencies
      - run: composer validate --strict
      - run: composer test
